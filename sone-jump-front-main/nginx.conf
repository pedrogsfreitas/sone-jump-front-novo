server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O roteamento é do react-router, no cliente. Sem este fallback, abrir
    # /app/dashboard direto (ou recarregar a página) devolveria 404 do nginx, porque
    # esse caminho não existe como arquivo.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets do Vite têm hash no nome, então nunca mudam de conteúdo: podem ser
    # guardados indefinidamente. O index.html não — é ele que aponta para os hashes
    # novos a cada deploy, e servir uma versão velha dele quebraria a aplicação.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
